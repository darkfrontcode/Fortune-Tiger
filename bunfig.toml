  "**/persistence/**",
  "**/infrastructure/audit/**",
  "**/infrastructure/journey/**",
  "src/infrastructure/mongo/**",
  "src/infrastructure/search/search.connection.ts",
  "src/**/factories/swagger.factory.ts",
  "src/**/factories/sqs.factory.ts",
  "src/**/consumers/sqs.consumer.ts",
  "src/**/queues/queue.loop.ts",
  "src/**/observability/observability.module.ts",
  "src/**/publishers/outbox.publisher.ts",
  "src/**/workers/outbox.worker.ts",
]
