root = "./src"
pathIgnorePatterns = ["**/persistence/**", "**/infrastructure/audit/tests/**", "**/infrastructure/journey/tests/**", "**/presentation/**/tests/*.e2e.test.ts", "**/health/**/tests/*.e2e.test.ts"]
