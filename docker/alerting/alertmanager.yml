global:
  smtp_smarthost: smtp.gmail.com:587
  smtp_from: darkfrontcode@gmail.com
  smtp_auth_username: darkfrontcode@gmail.com
  smtp_auth_password_file: /etc/alertmanager/smtp-password
  smtp_require_tls: true

route:
  receiver: email
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: darkfrontcode@gmail.com
