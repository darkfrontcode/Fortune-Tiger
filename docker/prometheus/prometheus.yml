global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/fortune-tiger.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: fortune-tiger
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']
