services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fortune_tiger
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fortune_tiger']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
    ports:
      - '4566:4566'
    volumes:
      - ./docker/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs list-queues > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 10
