apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: fortune-tiger
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: api-headless
  labels:
    app.kubernetes.io/part-of: fortune-tiger
spec:
  clusterIP: None
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http
