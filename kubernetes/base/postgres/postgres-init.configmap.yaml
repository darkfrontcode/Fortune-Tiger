apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app.kubernetes.io/part-of: fortune-tiger
data:
  01-replication.sh: |
    #!/bin/sh
    set -eu

    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 \
      --command "create role $REPLICATION_USER with replication login password '$REPLICATION_PASSWORD'"

    echo "host replication $REPLICATION_USER 0.0.0.0/0 scram-sha-256" >> "$PGDATA/pg_hba.conf"
