global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/fortune-tiger.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: fortune-tiger
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - api-headless.fortune-tiger.svc.cluster.local
        type: A
        port: 3000
