apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fortune-tiger
resources:
  - ../local
  - prometheus/prometheus.deployment.yaml
  - prometheus/prometheus.service.yaml
  - grafana/grafana.deployment.yaml
  - grafana/grafana.service.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus/prometheus.yml
  - name: grafana-datasource
    files:
      - ../../../docker/grafana/provisioning/datasources/prometheus.yml
  - name: grafana-dashboard-provider
    files:
      - ../../../docker/grafana/provisioning/dashboards/fortune-tiger.yml
  - name: grafana-dashboard
    files:
      - ../../../docker/grafana/dashboards/fortune-tiger.json
