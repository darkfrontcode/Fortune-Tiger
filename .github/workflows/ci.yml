name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fortune_tiger
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: http://localhost:4566/000000000000/wager-transactions.fifo
      SQS_DEAD_LETTER_QUEUE_URL: http://localhost:4566/000000000000/wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_URL: http://localhost:4566/000000000000/wager-events.fifo
      SQS_EVENTS_DEAD_LETTER_QUEUE_URL: http://localhost:4566/000000000000/wager-events-dlq.fifo
      MONGODB_URL: mongodb://localhost:27017/fortune_tiger_audit
      VECTOR_SEARCH_ENABLED: "true"
      SEARCH_MONGODB_URL: mongodb://localhost:27018/fortune_tiger_search?directConnection=true
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_EMBEDDING_MODEL: embeddinggemma
      MONGODB_EVENTS_COLLECTION: searchable_events
      MONGODB_VECTOR_INDEX: events_vector_index
      VECTOR_SEARCH_TOP_K: 5
      VECTOR_SEARCH_MAX_TEXT_LENGTH: 4000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fortune_tiger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: sqs
        ports:
          - 4566:4566
        options: >-
          --health-cmd "awslocal sqs list-queues > /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongodb-atlas-local:
        image: mongodb/mongodb-atlas-local
        ports:
          - 27018:27017

      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install

      - name: Create LocalStack SQS queues
        run: |
          aws --endpoint-url="$AWS_ENDPOINT_URL" sqs create-queue \
            --queue-name wager-transactions.fifo \
            --attributes FifoQueue=true
          aws --endpoint-url="$AWS_ENDPOINT_URL" sqs create-queue \
            --queue-name wager-transactions-dlq.fifo \
            --attributes FifoQueue=true
          aws --endpoint-url="$AWS_ENDPOINT_URL" sqs create-queue \
            --queue-name wager-events.fifo \
            --attributes FifoQueue=true
          aws --endpoint-url="$AWS_ENDPOINT_URL" sqs create-queue \
            --queue-name wager-events-dlq.fifo \
            --attributes FifoQueue=true

      - name: Run migrations
        run: bun run migration:up

      - name: Lint
        run: bun run lint

      - name: Type-check the code
        run: bun run build

      - name: Run unit tests
        run: bun run test:unit

      - name: Run the coverage suite
        run: bun run test:coverage

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Run integration tests
        run: bun run test:int

      - name: Run audit store integration tests
        run: bun run test:audit

      - name: Run journey store integration tests
        run: bun run test:journey

      - name: Run concurrency tests
        run: bun run test:concurrency

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Pull the Ollama embedding model
        run: |
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:11434/api/pull \
            -H 'content-type: application/json' \
            -d '{"name":"embeddinggemma","stream":false}'

      - name: Seed the semantic search read model
        run: bun run search:seed

      - name: Exercise a real semantic search
        run: bun run search:check

      - name: Check the OpenAPI document
        run: bun run openapi:export --check

      - name: Render the Kubernetes manifests
        run: bun run cluster:render

      - name: Build the container image
        run: docker build -t fortune-tiger:ci .

  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install

      - name: Start the cluster
        run: bun run cluster:up

      - name: Verify the cluster
        run: bun run cluster:verify

      - name: Print the cluster state
        if: failure()
        run: |
          KUBECTL=$(command -v kubectl || echo .tools/bin/kubectl)
          "$KUBECTL" get nodes -o wide
          "$KUBECTL" --namespace fortune-tiger get pods -o wide
          "$KUBECTL" --namespace fortune-tiger get events --sort-by=.lastTimestamp | tail -40
