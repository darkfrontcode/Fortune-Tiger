name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fortune_tiger
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: http://localhost:4566/000000000000/wager-transactions.fifo
      SQS_DEAD_LETTER_QUEUE_URL: http://localhost:4566/000000000000/wager-transactions-dlq.fifo

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fortune_tiger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: sqs
        ports:
          - 4566:4566
        options: >-
          --health-cmd "awslocal sqs list-queues > /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install

      - name: Create LocalStack SQS queues
        run: |
          aws --endpoint-url="$AWS_ENDPOINT_URL" sqs create-queue \
            --queue-name wager-transactions.fifo \
            --attributes FifoQueue=true
          aws --endpoint-url="$AWS_ENDPOINT_URL" sqs create-queue \
            --queue-name wager-transactions-dlq.fifo \
            --attributes FifoQueue=true

      - name: Run migrations
        run: bun run migration:up

      - name: Run unit tests
        run: bun run test:unit

      - name: Run integration tests
        run: bun run test:int

      - name: Run concurrency tests
        run: bun run test:concurrency

      - name: Run E2E tests
        run: bun run test:e2e
